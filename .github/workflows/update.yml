name: Update house prices

on:
  schedule:
    - cron: "15 4 * * *"   # every day at 04:15 UTC (06:15 Danish summer time)
  workflow_dispatch:        # adds a "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: Collect sales from boligsiden.dk
        run: python scraper.py

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Update house prices $(date -u +%F)"
          git push

      - name: Keep debug files (only created if something went wrong)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
